name: tuition_app
description: Home Tuition Platform - Unified App for Students, Teachers, Parents & Agents
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^13.0.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0
  
  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0
  
  # Firebase
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10
  firebase_auth: ^4.16.0
  flutter_local_notifications: ^20.0.0
  
  # HTTP
  http: ^1.1.0
  dio: ^5.4.0
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.2
  image_picker: ^1.0.5
  # file_picker: ^10.3.9
  share_plus: ^7.2.1
  http_parser: ^4.1.2
  google_fonts: ^8.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

